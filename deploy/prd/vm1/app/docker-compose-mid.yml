version: '3.8'
#启动命令 docker compose -p insurance -f docker-compose-mid.yml up -d
services:
  insurance-mysql-master:
    container_name: insurance-mysql-master
    image: mysql:8.4.2
    ports:
      - "3308:3306"
    volumes:
      # 数据挂载
      - ../data/insurancedata/mysql/data:/var/lib/mysql
      - ./mysql/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/sql:/opt/sql
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1',
      '--explicit_defaults_for_timestamp=true',
      '--server-id=1',
      '--log-bin=mysql-bin',
      '--binlog-ignore-db=mysql',
      '--binlog-cache-size=256M',
      '--binlog-format=ROW',
      '--max_connections=2000'
    ]
    restart: always
    networks:
      insurance_network_prd:
    healthcheck:
      test: mysql --user=insurancedev -h127.0.0.1 --password="$$MYSQL_ROOT_PASSWORD" -e "SELECT 1;"
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
  insurance-redis01:
    container_name: insurance-redis01
    image: redis:7.0.15
    ports:
      - "6380:6380"
      - "16380:16380"
    volumes:
      - ./redis/conf/redis01.conf:/usr/local/etc/redis/redis.conf
      - ../data/insurancedata/redis01/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    networks:
      insurance_network_prd:
    healthcheck:
      test: [ "CMD", "redis-cli","-p","6380", "ping" ]
      start_period: 3s
      interval: 3s
      timeout: 5s
      retries: 3
  insurance-redis02:
    container_name: insurance-redis02
    image: redis:7.0.15
    ports:
      - "6381:6381"
      - "16381:16381"
    volumes:
      - ./redis/conf/redis02.conf:/usr/local/etc/redis/redis.conf
      - ../data/insurancedata/redis02/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    networks:
      insurance_network_prd:
    healthcheck:
      test: [ "CMD", "redis-cli","-p","6381", "ping" ]
      start_period: 3s
      interval: 3s
      timeout: 5s
      retries: 3
  insurance-redis03:
    container_name: insurance-redis03
    image: redis:7.0.15
    ports:
      - "6382:6382"
      - "16382:16382"
    volumes:
      - ./redis/conf/redis03.conf:/usr/local/etc/redis/redis.conf
      - ../data/insurancedata/redis03/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    networks:
      insurance_network_prd:
    healthcheck:
      test: [ "CMD", "redis-cli","-p","6382", "ping" ]
      start_period: 3s
      interval: 3s
      timeout: 5s
      retries: 3
  insurance-nacos01:
    container_name: insurance-nacos01
    image: nacos/nacos-server:v2.2.2
    environment:
      - MODE=cluster
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - NACOS_APPLICATION_PORT=8854
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=192.168.56.107
      - MYSQL_SERVICE_PORT=3308
      - MYSQL_SERVICE_DB_NAME=insurance_nacos_prd
      - MYSQL_SERVICE_USER=insurancedev
      - MYSQL_SERVICE_PASSWORD=${MYSQL_SERVICE_PASSWORD:?Set MYSQL_SERVICE_PASSWORD}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE}
      - NACOS_SERVER_IP=192.168.56.107
      - NACOS_SERVERS=192.168.56.107:8854 192.168.56.107:8856 你的云服务器2内网ip/你的虚拟机2内网ip:8858
    volumes:
      - ../data/insurancedata/nacos01/logs/:/home/nacos/logs
      - ../data/insurancedata/nacos01/tomcatlogs/:/home/bit/nacos/tomcat/logs/
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8854:8854"
      - "9854:9854"
      - "9855:9855"
    restart: always
    networks:
      insurance_network_prd:
    depends_on:
      insurance-mysql-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8854/nacos" ]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
  insurance-nacos02:
    container_name: insurance-nacos02
    image: nacos/nacos-server:v2.2.2
    environment:
      - MODE=cluster
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - NACOS_APPLICATION_PORT=8856
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=192.168.56.107
      - MYSQL_SERVICE_PORT=3308
      - MYSQL_SERVICE_DB_NAME=insurance_nacos_prd
      - MYSQL_SERVICE_USER=insurancedev
      - MYSQL_SERVICE_PASSWORD=${MYSQL_SERVICE_PASSWORD:?Set MYSQL_SERVICE_PASSWORD}
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE}
      - NACOS_SERVER_IP=192.168.56.107
      - NACOS_SERVERS=192.168.56.107:8854 192.168.56.107:8856 你的云服务器2内网ip/你的虚拟机2内网ip:8858
    volumes:
      - ../data/insurancedata/nacos02/logs/:/home/nacos/logs
      - ../data/insurancedata/nacos02/tomcatlogs/:/home/bit/nacos/tomcat/logs/
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8856:8856"
      - "9856:9856"
      - "9857:9857"
    restart: always
    networks:
      insurance_network_prd:
    depends_on:
      insurance-mysql-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8856/nacos" ]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 10
  insurance-rabbitmq01:
    image: rabbitmq:3.12.6-management
    container_name: insurance-rabbitmq01
    restart: always
    hostname: insurance-rabbitmq01
    extra_hosts:
      - "insurance-rabbitmq02:你的云服务器2内网ip/你的虚拟机2内网ip"
    environment:
      RABBITMQ_ERLANG_COOKIE: 'insuranceCOOKIE'
      RABBITMQ_NODE_PORT: 5673
      RABBITMQ_NODENAME: "insurance-rabbitmq01"
      # 用户名
      RABBITMQ_DEFAULT_USER: admin
      # 密码
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    ports:
      - "4369:4369"
      - "5673:5673"
      - "15673:15673"
      - "25673:25673"
    volumes:
      - ./rabbitmq/conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ../data/insurancedata/rabbitmq01/log:/var/log/rabbitmq
      - ../data/insurancedata/rabbitmq01/data:/var/lib/rabbitmq
    networks:
      insurance_network_prd:
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 10
  insurance-webprd:
    image: nginx:1.24.0
    container_name: insurance-webprd
    restart: always
    networks:
      insurance_network_prd:
    ports:
      - "8666:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/web/dist:/data/insurance/web/dist

networks:
  insurance_network_prd:
