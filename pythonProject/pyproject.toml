[project]
name = "insurance-agent-platform"
version = "0.1.0"
description = "智能保险推荐与知识问答平台 — LangGraph + PostgreSQL + MySQL"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dashscope>=1.20.0",
    "fastapi>=0.115.0",
    "langchain>=1.0.0",
    # Legacy simple_agent is the only component that still uses Anthropic.
    "langchain-anthropic>=1.0.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "langchain-openai>=0.3.0",
    "pymilvus>=2.5.0",
    "pymysql>=1.1.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "httpx>=0.28.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

vectorizer = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[tool.uv.build-backend]
module-name = "insurance_agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]

[[tool.uv.build-backend.packages]]
from = "src/insurance_agent"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/knowledge_agent"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/crm_agent"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/supervisor_agent"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/shared"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/vectorizer"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/harness"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/infrastructure"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/api"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/middleware"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/tools"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/prompts"
include = ["**/*.py", "**/*.json"]

[[tool.uv.build-backend.packages]]
from = "src/agents"
include = ["**/*.py"]

[[tool.uv.build-backend.packages]]
from = "src/workflows"
include = ["**/*.py", "**/*.json"]

[[tool.uv.build-backend.packages]]
from = "src/safety"
include = ["**/*.py"]

[tool.ruff]
target-version = "py313"
