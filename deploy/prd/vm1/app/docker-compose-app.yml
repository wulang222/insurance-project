version: '3.8'
#启动命令 docker compose -p insurance -f docker-compose-mid.yml up -d
services:
  insurance-admin:
    build:
      context: service/admin
    image: insuranceprd/insurance-admin-service:1.0-SNAPSHOT
    container_name: insurance-admin-prd
    ports:
      - "18081:18081"
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 192.168.56.107:8854,192.168.56.107:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=192.168.56.107
    networks:
      insurance_network_prd:
  insurance-file:
    build:
      context: service/file
    ports:
      - "18082:18082"
    image: insuranceprd/insurance-file-service:1.0-SNAPSHOT
    container_name: insurance-file-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 192.168.56.107:8854,192.168.56.107:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=192.168.56.107
    networks:
      insurance_network_prd:
  insurance-gateway:
    build:
      context: service/gateway
    ports:
      - "18080:18080"
    image: insuranceprd/insurance-gateway-service:1.0-SNAPSHOT
    container_name: insurance-gateway-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 192.168.56.107:8854,192.168.56.107:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=192.168.56.107
    networks:
      insurance_network_prd:
  insurance-portal:
    build:
      context: service/portal
    ports:
      - "18083:18083"
    image: insuranceprd/insurance-portal-service:1.0-SNAPSHOT
    container_name: insurance-portal-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 192.168.56.107:8854,192.168.56.107:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=192.168.56.107
    networks:
      insurance_network_prd:
networks:
  insurance_network_prd:
